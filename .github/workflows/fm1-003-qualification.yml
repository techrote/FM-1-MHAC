                              "--offline", "--locked", "--manifest-path", str(strict/"Cargo.toml")], check=True)
                      exe = strict/"target/release/strict_scope"
                      import hashlib
                      # strict_scope deliberately selects candidate panel behavior by filename.
                      # Preserve the original witness, and stage byte-identical inputs under its
                      # established candidate.elf basename in separate disposable directories.
