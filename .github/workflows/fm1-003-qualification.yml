name: FM1-003 isolated native and target ELF qualification
on:
  pull_request:
    paths:
      - 'experiments/scope-weave-005/**'
      - '.github/workflows/fm1-003-qualification.yml'
permissions:
  contents: read
concurrency:
  group: fm1-003-qualification
  cancel-in-progress: true
jobs:
  qualify:
    if: github.head_ref == 'fm1/005-scope-weave' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact public PR merge revision
        run: |
          set -eu
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Native grammar and waveform falsifiers
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          for c in gcc clang; do
            "$c" -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all verify.c -o "$RUNNER_TEMP/scope-$c"
            "$RUNNER_TEMP/scope-$c" "$RUNNER_TEMP/$c.wav"
          done
          cmp "$RUNNER_TEMP/gcc.wav" "$RUNNER_TEMP/clang.wav"
          printf '%s\n' 'd0ef28f1703cb312f6da700acfb54ebdb8761192ad6daa48d9b629dd86929bea  gcc.wav' | (cd "$RUNNER_TEMP" && sha256sum -c -)
      - name: Native optional streaming receiver (all rates and arithmetic bounds)
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          for c in gcc clang; do
            "$c" -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -DSCOPE_RX_TEST scope_rx.c -o "$RUNNER_TEMP/rx-$c"
            "$RUNNER_TEMP/rx-$c"
          done
      - name: Native exact acoustic inverse and panel fixture
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          python3 scope_inverse.py --cc gcc > "$RUNNER_TEMP/inverse-gcc.txt"
          python3 scope_inverse.py --cc clang > "$RUNNER_TEMP/inverse-clang.txt"
          cmp "$RUNNER_TEMP/inverse-gcc.txt" "$RUNNER_TEMP/inverse-clang.txt"
          cat "$RUNNER_TEMP/inverse-gcc.txt"
          grep -Fx 'native atlas+phrases sha256 5c7512256a5d91ac6ed00a30059174691461e5d31e4964fd13533dfbd23867f6' "$RUNNER_TEMP/inverse-gcc.txt"
          python3 panel_inverse.py
      - name: Native contextual panel and receiver inverse
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          for c in gcc clang; do
            "$c" -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -DCP_TEST context_panel.c -o "$RUNNER_TEMP/context-$c"
            "$RUNNER_TEMP/context-$c" "$RUNNER_TEMP/context-$c.pcm"
            python3 context_inverse.py "$c" "$RUNNER_TEMP/context-$c.pcm" > "$RUNNER_TEMP/context-$c.txt"
          done
          cmp "$RUNNER_TEMP/context-gcc.pcm" "$RUNNER_TEMP/context-clang.pcm"
          cmp "$RUNNER_TEMP/context-gcc.txt" "$RUNNER_TEMP/context-clang.txt"
          cat "$RUNNER_TEMP/context-gcc.txt"
          printf '%s\n' '6b0f12a7de94a7b5c4d75deaa625baf088ead075c7320b484f1aeb413d416d25  context-gcc.pcm' | (cd "$RUNNER_TEMP" && sha256sum -c -)
      - name: Native acoustic edit equivalence and intentional retrigger
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          for c in gcc clang; do
            "$c" -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all policy_verify.c -o "$RUNNER_TEMP/policy-$c"
            "$RUNNER_TEMP/policy-$c" "$RUNNER_TEMP/policy-$c.pcm"
          done
          cmp "$RUNNER_TEMP/policy-gcc.pcm" "$RUNNER_TEMP/policy-clang.pcm"
      - name: Fetch pinned Dinghy and toolchain
        run: |
          set -eu
          git init -q "$RUNNER_TEMP/dinghy"
          git -C "$RUNNER_TEMP/dinghy" remote add origin https://github.com/zvenson/dinghy.git
          git -C "$RUNNER_TEMP/dinghy" fetch --depth=1 origin 92f17b28f2d05f2f78fd1b160b58475d518902c8
          git -C "$RUNNER_TEMP/dinghy" checkout --detach FETCH_HEAD
          curl -fL --retry 1 --max-time 90 -o "$RUNNER_TEMP/pi32v2.tar.xz" https://github.com/jvitkauskas/pi32v2-llvm/releases/download/pi32v2-23.1.5-2/pi32v2-llvm-23.1.5-2-linux-x64.tar.xz
      - name: Full pinned loader host fault witnesses (installation HOLD)
        timeout-minutes: 4
        run: |
          set -eu
          python3 evidence/fm1-record-fault/full_session.py "$RUNNER_TEMP/dinghy"
      - name: Actual target compilation and ELF link
        id: link
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          sh qualify_target.sh "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/scope-objects"
          sh qualify_link.sh "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/scope-objects"
      - name: Independent rebuild and inherited static audit
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          sh qualify_target.sh "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/scope-repeat"
          sh qualify_link.sh "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/scope-repeat"
          mkdir "$RUNNER_TEMP/audit-toolchain"
          tar -xJf "$RUNNER_TEMP/pi32v2.tar.xz" -C "$RUNNER_TEMP/audit-toolchain" --strip-components=1
          python3 audit_elf.py "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/audit-toolchain/bin" "$RUNNER_TEMP/scope-objects" "$RUNNER_TEMP/scope-repeat"
      - name: Optional streaming receiver target object (no firmware integration)
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        timeout-minutes: 2
        run: |
          set -eu
          TC="$RUNNER_TEMP/audit-toolchain/bin"
          test -x "$TC/clang"
          "$TC/clang" -target pi32v2 -mcpu=ac791n -std=c11 -Os -ffreestanding -fno-builtin -Wall -Wextra -Werror -c scope_rx.c -o "$RUNNER_TEMP/scope-rx.o"
          "$TC/llvm-readelf" -h "$RUNNER_TEMP/scope-rx.o"
          "$TC/llvm-size" "$RUNNER_TEMP/scope-rx.o"
          "$TC/llvm-nm" -u "$RUNNER_TEMP/scope-rx.o"
          sha256sum scope_rx.c scope_weave.h "$RUNNER_TEMP/scope-rx.o"
          echo 'Receiver target object only: no link, target execution, real-time budget or physical input claim.'
      - name: Direct object provenance and map-enabled exact relink (HOLD preserved)
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        timeout-minutes: 3
        run: |
          set -eu
          node direct_object.mjs --selftest
          D="$RUNNER_TEMP/scope-direct-map"
          mkdir "$D"
          cp "$RUNNER_TEMP/scope-objects/baseline.o" "$RUNNER_TEMP/scope-objects/candidate.o" "$D/"
          # Only add a map output to a disposable copy of the existing pinned linker script.
          python3 - "$D/link.sh" <<'PY'
          import sys
          from pathlib import Path
          source=Path("qualify_link.sh").read_text()
          old='-o "$OUT/$n.elf"'
          assert source.count(old)==1
          Path(sys.argv[1]).write_text(source.replace(old,'-Map="$OUT/$n.map" '+old))
          PY
          sh "$D/link.sh" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$D"
          failed=0
          for n in baseline candidate; do
            kind="$n"
            if test "$n" = candidate; then kind=scope; fi
            if ! node direct_object.mjs "$kind" "$D/$n.o" "$RUNNER_TEMP/scope-objects/$n.elf" "$D/$n.elf" "$D/$n.map"; then
              failed=1
            fi
          done
          test "$failed" = 0
      - name: Scope Weave strict modeled panel and acoustic inverse
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        timeout-minutes: 12
        run: |
          set -eu
          P="$RUNNER_TEMP/scope-pcm"
          mkdir "$P"
          EMU="$RUNNER_TEMP/fm1-emu"
          PIN=736aded65c8e2e9d652cf595fca248734483a877
          git init -q "$EMU"
          git -C "$EMU" remote add origin https://github.com/joakimeriksson/fm1-emu.git
          git -C "$EMU" fetch --depth=1 origin "$PIN"
          git -C "$EMU" checkout --detach FETCH_HEAD
          test "$(git -C "$EMU" rev-parse HEAD)" = "$PIN"
          rustup toolchain install 1.95.0 --profile minimal
          rustup run 1.95.0 rustc --version --verbose
          D="$RUNNER_TEMP/scope-strict"
          mkdir -p "$D/src"
          cp strict_scope.rs "$D/src/main.rs"
          cat > "$D/Cargo.toml" <<EOF
          [package]
          name = "strict_scope"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          fm1-soc = { path = "$EMU/crates/fm1-soc" }
          fm1-core = { path = "$EMU/crates/fm1-core" }
          [workspace]
          EOF
          rustup run 1.95.0 cargo generate-lockfile --offline --manifest-path "$D/Cargo.toml"
          rustup run 1.95.0 cargo test --offline --locked --manifest-path "$D/Cargo.toml"
          rustup run 1.95.0 cargo build --release --offline --locked --manifest-path "$D/Cargo.toml"
          test -z "$(git -C "$EMU" status --porcelain)"
          ELF="$RUNNER_TEMP/scope-objects/candidate.elf"
          sha256sum "$ELF"
          failed=0
          for part in puya uc25hq80; do
            if test "$part" = puya; then modes="0 1 2"; else modes="0"; fi
            for mode in $modes; do
              for preset in 3 9; do
                prefix="$P/$part-$mode-$preset"
                if FM1_PANEL_MODE="$mode" FM1_PANEL_PRESET="$preset" FM1_PCM_CAPTURE_PREFIX="$prefix" timeout 60s "$D/target/release/strict_scope" "$ELF" "$part" 800000000; then
                  if python3 panel_inverse.py "$prefix" "$mode" "$preset"; then
                    echo "case=$part/$mode/$preset PASS modeled scope contract"
                  else
                    echo "case=$part/$mode/$preset HOLD decoder"; failed=1
                  fi
                else
                  echo "case=$part/$mode/$preset HOLD emulator"; failed=1
                fi
              done
            done
          done
          if test "$failed" = 0; then
            cmp "$P/puya-0-3.pcm" "$P/uc25hq80-0-3.pcm"
            cmp "$P/puya-0-9.pcm" "$P/uc25hq80-0-9.pcm"
          fi
          rm -rf "$P"
          test "$failed" = 0
      - name: Contextual panel target link and unchanged static audit
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          V="$RUNNER_TEMP/context-variant"
          mkdir "$V"
          cp qualify_target.sh qualify_link.sh target_probe.c audit_elf.py scope_weave.h "$V/"
          # Expand only our local include so the existing audited unity-build
          # harness can compile both source files without changing its contract.
          python3 - "$V" <<'PY'
          import sys
          from pathlib import Path
          p=Path("context_panel.c").read_text()
          inc='#include "scope_context.c"'
          assert p.count(inc)==1
          (Path(sys.argv[1])/"app.c").write_text(p.replace(inc,Path("scope_context.c").read_text()))
          PY
          sha256sum "$V/app.c"
          for variant in context-objects context-repeat; do
            sh "$V/qualify_target.sh" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/$variant"
            sh "$V/qualify_link.sh" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/$variant"
          done
          mkdir "$RUNNER_TEMP/context-audit-toolchain"
          tar -xJf "$RUNNER_TEMP/pi32v2.tar.xz" -C "$RUNNER_TEMP/context-audit-toolchain" --strip-components=1
          python3 "$V/audit_elf.py" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/context-audit-toolchain/bin" "$RUNNER_TEMP/context-objects" "$RUNNER_TEMP/context-repeat"

      - name: Contextual native physical-key capture contracts
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          python3 context_capture.py
      - name: Contextual strict modeled panel and acoustic receiver
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        timeout-minutes: 9
        run: |
          set -eu
          ELF="$RUNNER_TEMP/context-objects/candidate.elf"
          test -s "$ELF"
          sha256sum "$ELF"
          EMU="$RUNNER_TEMP/fm1-emu"
          test "$(git -C "$EMU" rev-parse HEAD)" = 736aded65c8e2e9d652cf595fca248734483a877
          D="$RUNNER_TEMP/scope-strict"
          cp strict_context.rs "$D/src/main.rs"
          rustup run 1.95.0 cargo test --offline --locked --manifest-path "$D/Cargo.toml"
          rustup run 1.95.0 cargo build --release --offline --locked --manifest-path "$D/Cargo.toml"
          test -z "$(git -C "$EMU" status --porcelain)"
          P="$RUNNER_TEMP/context-modeled-pcm"
          mkdir "$P"
          failed=0
          for part in puya uc25hq80; do
            if test "$part" = puya; then cases="literal witness unwitnessed unknown edited"; else cases="witness"; fi
            for case in $cases; do
              prefix="$P/$part-$case"
              keys="$(python3 -c 'import sys; from context_capture import CASES; print(CASES[sys.argv[1]][0])' "$case")"
              if FM1_CONTEXT_KEYS="$keys" FM1_PCM_CAPTURE_PREFIX="$prefix" timeout 65s "$D/target/release/strict_scope" "$ELF" "$part" 800000000; then
                if python3 context_capture.py "$prefix" "$case"; then
                  echo "context-case=$part/$case PASS"
                else
                  echo "context-case=$part/$case HOLD decoder"; failed=1
                fi
              else
                echo "context-case=$part/$case HOLD emulator"; failed=1
              fi
            done
          done
          if test "$failed" = 0; then
            cmp "$P/puya-witness.pcm" "$P/uc25hq80-witness.pcm"
            echo "context cross-model PCM PASS"
          fi
          rm -rf "$P"
          test "$failed" = 0
      - name: Optional contextual edit policy target compile and ELF link
        id: policy_link
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          V="$RUNNER_TEMP/policy-variant"
          mkdir "$V"
          cp qualify_target.sh qualify_link.sh target_probe.c scope_weave.h "$V/"
          python3 - "$V" <<'PY'
          import sys
          from pathlib import Path
          p=Path("context_panel.c").read_text()
          for inc in ("scope_context.c","context_policy.h"):
              marker='#include "'+inc+'"'
              assert p.count(marker)==1
              p=p.replace(marker,Path(inc).read_text())
          (Path(sys.argv[1])/"app.c").write_text("#define CP_POLICY_TARGET\n"+p)
          PY
          sha256sum "$V/app.c"
          sh "$V/qualify_target.sh" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/policy-objects"
          sh "$V/qualify_link.sh" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/policy-objects"
          sha256sum "$RUNNER_TEMP/policy-objects/candidate.elf"
          echo 'Optional policy ELF link only; static audit and modeled execution remain HOLD.'
      - name: Native live policy differential witness
        if: ${{ !cancelled() }}
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          python3 policy_capture.py
          for c in gcc clang; do
            "$c" -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all live_policy_fixture.c -o "$RUNNER_TEMP/live-$c"
            for mode in 0 1 2 3; do
              "$RUNNER_TEMP/live-$c" "$mode" > "$RUNNER_TEMP/live-$c-$mode.pcm"
            done
          done
          for mode in 0 1 2 3; do
            cmp "$RUNNER_TEMP/live-gcc-$mode.pcm" "$RUNNER_TEMP/live-clang-$mode.pcm"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import sys
          from pathlib import Path
          from policy_capture import pcm,judge
          p=Path(sys.argv[1])
          ref=pcm((p/'live-gcc-0.pcm').read_bytes())
          for mode in (1,2,3):
              got=pcm((p/f'live-gcc-{mode}.pcm').read_bytes())
              at=judge(ref,got,2*18522,mode!=1)
              assert at==(None if mode==1 else 18522)
              print(f'native mode={mode} restart_frame={at} PASS')
          PY
      - name: Optional policy independent ELF rebuild and unchanged static audit
        if: ${{ !cancelled() && steps.policy_link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          V="$RUNNER_TEMP/policy-variant"
          cp audit_elf.py "$V/"
          sh "$V/qualify_target.sh" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/policy-repeat"
          sh "$V/qualify_link.sh" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/policy-repeat"
          python3 "$V/audit_elf.py" "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/audit-toolchain/bin" "$RUNNER_TEMP/policy-objects" "$RUNNER_TEMP/policy-repeat"
      - name: Optional policy live physical-key DAC differential
        if: ${{ !cancelled() && steps.policy_link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        timeout-minutes: 5
        run: |
          set -eu
          ELF="$RUNNER_TEMP/policy-objects/candidate.elf"
          EMU="$RUNNER_TEMP/fm1-emu"
          test "$(git -C "$EMU" rev-parse HEAD)" = 736aded65c8e2e9d652cf595fca248734483a877
          D="$RUNNER_TEMP/scope-strict"
          cp strict_policy.rs "$D/src/main.rs"
          rustup run 1.95.0 cargo test --offline --locked --manifest-path "$D/Cargo.toml"
          rustup run 1.95.0 cargo build --release --offline --locked --manifest-path "$D/Cargo.toml"
          test -z "$(git -C "$EMU" status --porcelain)"
          P="$RUNNER_TEMP/policy-live"
          mkdir "$P"
          for case in control eq explicit raw; do
            keys="N0 N1 N6 N8 N8"
            case "$case" in
              control) live=N8;;
              eq) live=N9;;
              explicit) live=N26;;
              raw) keys="N0 N1 N6 N8 N25"; live=N9;;
            esac
            FM1_CONTEXT_KEYS="$keys" FM1_LIVE_KEY="$live" FM1_PCM_CAPTURE_PREFIX="$P/$case" timeout 65s "$D/target/release/strict_scope" "$ELF" puya 800000000
          done
          python3 policy_capture.py "$P/control" "$P/eq" "$P/explicit" "$P/raw"
          rm -rf "$P"
      - name: Pinned ELF byte and destination diagnostics (HOLD preserved)
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        run: |
          set -eu
          node inspect_elf_evidence.mjs --selftest
          for d in scope-objects scope-repeat; do
            node inspect_elf_evidence.mjs baseline "$RUNNER_TEMP/$d/baseline.elf" "$RUNNER_TEMP/audit-toolchain/bin/llvm-objdump"
            node inspect_elf_evidence.mjs scope "$RUNNER_TEMP/$d/candidate.elf" "$RUNNER_TEMP/audit-toolchain/bin/llvm-objdump"
          done
      - name: Complete MMIO census at matched peripheral-readiness endpoint
        if: ${{ !cancelled() && steps.policy_link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node mmio_census.mjs --selftest
          D="$RUNNER_TEMP/scope-strict"
          EMU="$RUNNER_TEMP/fm1-emu"
          test "$(git -C "$EMU" rev-parse HEAD)" = 736aded65c8e2e9d652cf595fca248734483a877
          cp strict_scope.rs "$D/src/main.rs"
          rustup run 1.95.0 cargo test --offline --locked --manifest-path "$D/Cargo.toml"
          rustup run 1.95.0 cargo build --release --offline --locked --manifest-path "$D/Cargo.toml"
          test -z "$(git -C "$EMU" status --porcelain)"
          P="$RUNNER_TEMP/mmio-boot"
          mkdir "$P"
          for part in puya uc25hq80; do
            for variant in baseline scope context policy; do
              case "$variant" in
                baseline) ELF="$RUNNER_TEMP/scope-objects/baseline.elf";;
                *) ELF="$RUNNER_TEMP/$variant-objects/candidate.elf";;
              esac
              sha256sum "$ELF"
              FM1_MMIO_BOOT_ONLY=1 timeout 45s "$D/target/release/strict_scope" "$ELF" "$part" 800000000 | tee "$P/$part-$variant.log"
            done
          done
          node mmio_census.mjs "$P"
      - name: Diagnostic MMIO instruction context with unmodified transcript comparison
        if: ${{ !cancelled() && steps.policy_link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node mmio_origin.mjs --selftest
          D="$RUNNER_TEMP/scope-strict"
          EMU="$RUNNER_TEMP/fm1-emu"
          TRACE="$RUNNER_TEMP/fm1-emu-origin"
          T="$RUNNER_TEMP/scope-origin"
          cp -a "$EMU" "$TRACE"
          node mmio_origin.mjs --install "$TRACE"
          mkdir -p "$T/src"
          cp strict_scope.rs "$T/src/main.rs"
          sed "s|$EMU/crates/|$TRACE/crates/|g" "$D/Cargo.toml" > "$T/Cargo.toml"
          cp "$D/Cargo.lock" "$T/Cargo.lock"
          rustup run 1.95.0 cargo test --offline --locked --manifest-path "$T/Cargo.toml"
          rustup run 1.95.0 cargo build --release --offline --locked --manifest-path "$T/Cargo.toml"
          P="$RUNNER_TEMP/mmio-boot"
          for part in puya uc25hq80; do
            for variant in baseline policy; do
              case "$variant" in
                baseline) ELF="$RUNNER_TEMP/scope-objects/baseline.elf";;
                policy) ELF="$RUNNER_TEMP/policy-objects/candidate.elf";;
              esac
              FM1_MMIO_BOOT_ONLY=1 timeout 60s "$T/target/release/strict_scope" "$ELF" "$part" 800000000 > "$P/$part-$variant.origin.log" 2>&1
              node mmio_origin.mjs --compare "$P/$part-$variant.log" "$P/$part-$variant.origin.log" "$ELF" "$RUNNER_TEMP/audit-toolchain/bin/llvm-objdump"
            done
          done
          test -z "$(git -C "$EMU" status --porcelain)"
      - name: Compiler assembly round-trip evidence (original HOLD preserved)
        if: ${{ !cancelled() && steps.link.outcome == 'success' }}
        working-directory: experiments/scope-weave-005
        timeout-minutes: 4
        run: |
          set -eu
          python3 compiler_evidence.py "$RUNNER_TEMP/dinghy" "$RUNNER_TEMP/pi32v2.tar.xz" "$RUNNER_TEMP/scope-objects" "$RUNNER_TEMP/scope-repeat"
# No package, no binary publication or physical device access.
