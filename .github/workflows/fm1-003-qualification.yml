                      need(compare_pcm(b"1234abcd",b"1234abce") == (False,1), "sample mismatch fixture")
                      need(compare_pcm(b"1234",b"1234abcd") == (False,1), "length mismatch fixture")
                      all_exact = True
                      for part, mode, preset in (("puya", 0, 3), ("uc25hq80", 0, 9), ("puya", 2, 9)):
