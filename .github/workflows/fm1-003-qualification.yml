                                     env=env, check=True, timeout=60)
                              inverse = sp.check_output([sys.executable, str(here/"panel_inverse.py"), str(prefix),
                                                        str(mode), str(preset)], timeout=30, text=True)
                              print(inverse, end="", flush=True)
                              origins = re.findall(r"\borigin_frame=(\d+)\b", inverse)
                              need(len(origins)==1, "missing unique acoustic origin")
                              pcm = prefix.with_suffix(".pcm").read_bytes()
                              capture_bounds = tuple(map(int,prefix.with_suffix(".bounds").read_text().split()))
                              offset = 4*int(origins[0])
                              # Two phrases of SPAN int16 samples each; alignment is diagnostic
                              # only and never substitutes for the complete PCM identity gate.
                              stop = offset+4*SPAN
                              need(0 <= offset < stop <= len(pcm), "invalid phrase span")
                              captures.append(pcm)
                              aligned.append(pcm[offset:stop])
                              bounds.append(capture_bounds)
                          exact, first = compare_pcm(*captures)
                          phrase_exact, phrase_first = compare_pcm(*aligned)
                          all_exact = all_exact and exact
                          print("no_jt_pcm " + json.dumps({"part":part,"mode":mode,"preset":preset,
                              "bytes":[len(c) for c in captures],
                              "sha256":[hashlib.sha256(c).hexdigest() for c in captures],
                              "bounds":bounds,"first_difference_frame":first,
                              "aligned_two_phrases_exact":phrase_exact,
                              "aligned_first_difference_frame":phrase_first,
                              "exact":exact,"installation_authorized":False}), flush=True)
                      need(all_exact, "modeled PCM mismatch")
